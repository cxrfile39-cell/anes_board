<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻醉次專科文獻週報 | Anesthesiology Weekly Digest</title>
<style>
  /* 雙色主題：主色 深青 teal ＋ 強調色 橘 orange */
  :root{
    --c1:#0d5c6e; --c1-dark:#08404d; --c1-soft:#e2f0f2;
    --c2:#e8792e; --c2-soft:#fdeee2;
    --bg:#f4f7f8; --card:#fff; --on:#fff; --ink:#1b2a30; --muted:#5b6d74; --line:#dde6e8;
  }
  @media (prefers-color-scheme: dark){
    :root{--c1:#4fb8c9;--c1-dark:#0b3540;--c1-soft:#16343b;--c2:#f29a55;--c2-soft:#3a2a1e;
      --bg:#10171a;--card:#182226;--on:#0c1a1e;--ink:#e5eef0;--muted:#97a9ae;--line:#2a383d;}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:linear-gradient(135deg,#0d5c6e 0%,#08404d 100%);color:#fff;padding:22px 16px 18px;border-bottom:4px solid var(--c2)}
  .wrap{max-width:1180px;margin:0 auto}
  h1{margin:0;font-size:1.5rem;letter-spacing:.02em}
  h1 .hl{color:var(--c2)}
  @media (prefers-color-scheme: dark){ h1 .hl{color:#f6a868} }
  .sub{color:rgba(255,255,255,.78);font-size:.9rem;margin-top:4px}
  main.wrap{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px 16px 60px}
  @media (max-width:860px){main.wrap{grid-template-columns:1fr}}
  aside{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:14px}
  @media (max-width:860px){aside{position:static}}
  .panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c1);border-radius:12px;padding:14px}
  .panel h2{font-size:.95rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;color:var(--c1)}
  .btns{display:flex;gap:6px}
  button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:7px;padding:4px 10px;cursor:pointer}
  button:hover{border-color:var(--c2);color:var(--c2)}
  .btns button:first-child{background:var(--c1);border-color:var(--c1);color:var(--on)}
  .btns button:first-child:hover{filter:brightness(1.1);background:var(--c1);color:var(--on)}
  .btns button:last-child{background:var(--card);border-color:var(--c2);color:var(--c2)}
  .btns button:last-child:hover{background:var(--c2);color:var(--on)}
  button:disabled{opacity:.4;cursor:default}
  label.opt{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:.9rem}
  label.opt:hover{background:var(--c1-soft)}
  label.opt input{accent-color:var(--c1);width:16px;height:16px;flex:none}
  label.opt .name{flex:1}
  label.opt .en{display:block;color:var(--muted);font-size:.74rem;line-height:1.2}
  .cnt{font-size:.75rem;color:var(--c1);background:var(--c1-soft);border-radius:10px;padding:1px 8px;font-variant-numeric:tabular-nums;font-weight:600}
  select,input[type=search]{width:100%;font:inherit;font-size:.9rem;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--ink)}
  select:focus,input[type=search]:focus{outline:2px solid var(--c2);outline-offset:-1px;border-color:transparent}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .toolbar input[type=search]{flex:1;min-width:200px}
  .toolbar select{width:auto}
  .summary{color:var(--muted);font-size:.88rem;margin-bottom:10px}
  .card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c1);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card.t-guideline{border-left-color:var(--c2)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);margin-bottom:6px}
  .badge{font-weight:600;border-radius:5px;padding:1px 7px;font-size:.74rem;border:1.5px solid transparent}
  .b-article{background:transparent;color:var(--c1);border-color:var(--c1)}
  .b-review{background:var(--c1);color:var(--on)}
  .b-guideline{background:var(--c2);color:var(--on)}
  .tag{border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:.72rem}
  .card h3{font-size:1rem;margin:0 0 4px;line-height:1.4}
  .card h3 a{color:var(--ink);text-decoration:none} .card h3 a:hover{color:var(--c2);text-decoration:underline}
  .authors{font-size:.84rem;color:var(--muted)}
  .links{margin-top:8px;display:flex;gap:12px;font-size:.84rem;flex-wrap:wrap}
  .links a{color:var(--c1);text-decoration:none;font-weight:500} .links a:hover{color:var(--c2);text-decoration:underline}
  details summary{cursor:pointer;color:var(--c2);font-size:.84rem;margin-top:6px;font-weight:500}
  details p{font-size:.88rem;white-space:pre-line;margin:6px 0 0}
  .empty{text-align:center;color:var(--muted);padding:50px 10px}
  .pager{display:flex;justify-content:center;gap:8px;margin-top:10px}
  mark{background:var(--c2-soft);color:inherit;border-bottom:2px solid var(--c2);border-radius:2px}
  .stamp{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .stamp span{background:var(--c2);color:var(--on);border-radius:999px;padding:3px 12px;font-size:.84rem;font-weight:600}
  .stamp span.next{background:rgba(255,255,255,.14);color:#fff;font-weight:500}
  /* ===== 麻醉元素 ===== */
  header{position:relative;overflow:hidden;padding-bottom:92px}
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;position:relative;z-index:1}
  h1 .logo{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.22em;margin-right:.35em}
  .monitor{background:#061f26;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 10px;
    display:grid;grid-template-columns:repeat(3,auto);gap:4px 14px;box-shadow:inset 0 0 18px rgba(0,0,0,.45);
    font-family:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace}
  .monitor .cell{min-width:74px}
  .monitor .lbl{font-size:.66rem;letter-spacing:.06em;opacity:.85;display:flex;justify-content:space-between;gap:6px}
  .monitor .val{font-size:1.7rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
  .monitor .unit{font-size:.62rem;opacity:.7}
  .m-art{color:#7fdbe8} .m-rev{color:#ffffff} .m-gl{color:#ff9d57}
  .monitor .bar{grid-column:1/-1;font-size:.62rem;color:#8fb3ba;letter-spacing:.05em;border-top:1px dashed rgba(255,255,255,.15);padding-top:4px;display:flex;justify-content:space-between}
  .blink{animation:blink 1.2s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .waves{position:absolute;left:0;right:0;bottom:6px;height:80px;pointer-events:none}
  .waves .lab{position:absolute;left:16px;font:600 .62rem/1 "SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em}
  .waves svg{position:absolute;left:0;width:2400px;height:100%;animation:sweep 9s linear infinite}
  .waves path{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
  @media (prefers-reduced-motion:reduce){.waves svg,.blink{animation:none}}
  .ic{display:inline-block;width:1.35em;text-align:center;margin-right:2px}
  .tag .ic{width:auto;margin-right:3px}
  .loading{text-align:center;color:var(--muted);padding:50px 10px}
  .loading .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c2);margin:0 3px;animation:breath 1.4s ease-in-out infinite}
  .loading .dot:nth-child(2){animation-delay:.2s}.loading .dot:nth-child(3){animation-delay:.4s}
  @keyframes breath{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1);opacity:1}}
  footer .fico{width:90px;height:22px;display:block;margin:0 auto 6px}
  footer{color:var(--muted);font-size:.78rem;text-align:center;padding:16px 16px 30px;border-top:3px solid var(--c1);max-width:1180px;margin:0 auto}
</style>
</head>
<body>
<header>
  <div class="wrap head-row">
    <div>
      <h1><svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <!-- 麻醉面罩（正面）：氣墊罩體＋中央接頭 -->
          <path d="M16 3.5C13 3.5 5 18 5 23.5c0 3 3 5 11 5s11-2 11-5C27 18 19 3.5 16 3.5z" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="16" cy="19" r="5.2" fill="#0d5c6e" stroke="#e8792e" stroke-width="2.2"/>
          <circle cx="16" cy="19" r="2" fill="#e8792e"/>
        </svg>麻醉次專科<span class="hl">文獻週報</span></h1>
      <div class="sub">Anesthesiology Subspecialties · 最新期刊論文 / 綜述 / 指引 · 每週一自動更新（資料來源：PubMed）</div>
      <div class="sub">製作者：JH CHIU MD × Claude Opus 5.5</div>
      <div class="stamp" id="updated"></div>
    </div>
    <div class="monitor" aria-label="本週文獻統計">
      <div class="cell m-art"><div class="lbl"><span>ART</span><span class="unit">篇</span></div><div class="val" id="mArt">--</div><div class="unit">本週文獻</div></div>
      <div class="cell m-rev"><div class="lbl"><span>REV</span><span class="unit">篇</span></div><div class="val" id="mRev">--</div><div class="unit">綜述/統合</div></div>
      <div class="cell m-gl"><div class="lbl"><span>GL</span><span class="unit">篇</span></div><div class="val" id="mGl">--</div><div class="unit">指引/共識</div></div>
      <div class="bar"><span><span class="blink">●</span> MONITORING PubMed</span><span id="mWeek"></span></div>
    </div>
  </div>
  <div class="waves" aria-hidden="true">
    <span class="lab" style="top:2px;color:#7fdbe8">II · ECG</span>
    <svg viewBox="0 0 2400 40" preserveAspectRatio="none" style="top:10px;height:32px"><path id="ecg" stroke="#7fdbe8" opacity=".85"/></svg>
    <span class="lab" style="top:44px;color:#ff9d57">EtCO₂</span>
    <svg viewBox="0 0 2400 30" preserveAspectRatio="none" style="top:52px;height:26px;animation-duration:13s"><path id="co2" stroke="#ff9d57" opacity=".9"/></svg>
  </div>
</header>

<main class="wrap">
  <aside>
    <div class="panel">
      <h2>週次</h2>
      <select id="week"></select>
    </div>

    <div class="panel">
      <h2>次專科
        <span class="btns">
          <button type="button" id="spAll">全選</button>
          <button type="button" id="spNone">全不選</button>
        </span>
      </h2>
      <div id="spList"></div>
    </div>

    <div class="panel">
      <h2>文章類型
        <span class="btns">
          <button type="button" id="tyAll">全選</button>
          <button type="button" id="tyNone">全不選</button>
        </span>
      </h2>
      <div id="tyList"></div>
    </div>
  </aside>

  <section>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜尋標題、摘要、作者、期刊…">
      <select id="sort">
        <option value="entrez">依 PubMed 收錄日</option>
        <option value="pub">依出版日期</option>
        <option value="journal">依期刊名稱</option>
      </select>
    </div>
    <div class="summary" id="summary"></div>
    <div id="list"></div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<footer>
  <svg class="fico" viewBox="0 0 90 22" aria-hidden="true"><path d="M0 19H12L16 6Q32 4 44 3L48 19H58L62 6Q74 4 84 3L88 19" fill="none" stroke="var(--c2)" stroke-width="2" stroke-linejoin="round"/></svg>
  製作者：JH CHIU MD × Claude Opus 5.5<br>
  資料由 NCBI PubMed E-utilities 自動擷取，分類依關鍵字與期刊檢索式，僅供參考。
</footer>

<script>
const TYPES = [
  {id:"article",  zh:"原始研究", en:"Journal Article"},
  {id:"review",   zh:"綜述 / 統合分析", en:"Review · SR · MA"},
  {id:"guideline",zh:"指引 / 共識", en:"Guideline · Consensus"},
];
const PAGE = 50;
// 次專科圖示
const ICON = {general:"😴", cardiothoracic:"🫀", neuro:"🧠", pediatric:"👶", obstetric:"🤰", regional:"💉",
  pain:"⚡", critical:"🫁", transplant:"🔄", ambulatory:"🚶", trauma:"🚑", geriatric:"👴"};
const ic = id => ICON[id] ? `<span class="ic" aria-hidden="true">${ICON[id]}</span>` : "";

// 生理監視器波形（ECG 與二氧化碳描記圖），重複繪製供捲動
(function drawWaves(){
  let ecg = "M0 22", co2 = "M0 26";
  for(let x=0; x<2400; x+=120){            // 每 120 單位一個心跳
    ecg += ` L${x+40} 22 Q${x+46} 17 ${x+52} 22 L${x+60} 22 L${x+63} 26 L${x+67} 3 L${x+71} 34 L${x+74} 22 L${x+86} 22 Q${x+96} 13 ${x+106} 22 L${x+120} 22`;
  }
  for(let x=0; x<2400; x+=300){            // 每 300 單位一次呼吸：phase I→II→III 平台→吸氣下降
    co2 += ` L${x+80} 26 C${x+86} 26 ${x+88} 8 ${x+98} 7 L${x+200} 4 C${x+206} 4 ${x+208} 26 ${x+216} 26 L${x+300} 26`;
  }
  document.getElementById("ecg").setAttribute("d", ecg);
  document.getElementById("co2").setAttribute("d", co2);
})();

function renderMonitor(){
  const a = state.weekData?.articles || [];
  const n = t => a.filter(x=>x.type===t).length;
  $("mArt").textContent = state.weekData ? a.length : "--";
  $("mRev").textContent = state.weekData ? n("review") : "--";
  $("mGl").textContent  = state.weekData ? n("guideline") : "--";
  $("mWeek").textContent = state.weekData ? `${state.weekData.from.slice(5)}~${state.weekData.to.slice(5)}` : "";
}
const state = {sp:[], weekData:null, page:1, selSp:new Set(), selTy:new Set(TYPES.map(t=>t.id))};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function store(){
  try{ localStorage.setItem("anesth-filter", JSON.stringify({sp:[...state.selSp], ty:[...state.selTy]})); }catch(e){}
}
function restore(){
  try{
    const s = JSON.parse(localStorage.getItem("anesth-filter") || "null");
    if(s){ state.selSp = new Set(s.sp); state.selTy = new Set(s.ty); return true; }
  }catch(e){}
  return false;
}

function renderChecks(){
  const arts = state.weekData?.articles || [];
  const spCount = {}, tyCount = {};
  for(const a of arts){
    for(const c of a.categories) spCount[c] = (spCount[c]||0)+1;
    tyCount[a.type] = (tyCount[a.type]||0)+1;
  }
  $("spList").innerHTML = state.sp.map(s => `
    <label class="opt"><input type="checkbox" data-sp="${s.id}" ${state.selSp.has(s.id)?"checked":""}>
      ${ic(s.id)}<span class="name">${esc(s.zh)}<span class="en">${esc(s.en)}</span></span>
      <span class="cnt">${spCount[s.id]||0}</span></label>`).join("");
  $("tyList").innerHTML = TYPES.map(t => `
    <label class="opt"><input type="checkbox" data-ty="${t.id}" ${state.selTy.has(t.id)?"checked":""}>
      <span class="name">${t.zh}<span class="en">${t.en}</span></span>
      <span class="cnt">${tyCount[t.id]||0}</span></label>`).join("");
}

function highlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
  return safe.replace(re, "<mark>$1</mark>");
}

function filtered(){
  const q = $("q").value.trim().toLowerCase();
  let arts = (state.weekData?.articles || []).filter(a =>
    state.selTy.has(a.type) && a.categories.some(c => state.selSp.has(c)) &&
    (!q || (a.title+" "+a.abstract+" "+a.authors.join(" ")+" "+a.journal).toLowerCase().includes(q)));
  const s = $("sort").value;
  const cmp = {
    entrez:(a,b)=> (b.entrez||"").localeCompare(a.entrez||"") || (b.sortdate||"").localeCompare(a.sortdate||""),
    pub:(a,b)=> (b.sortdate||"").localeCompare(a.sortdate||""),
    journal:(a,b)=> a.journal.localeCompare(b.journal),
  }[s];
  return arts.slice().sort(cmp);
}

function renderList(){
  const arts = filtered();
  const q = $("q").value.trim();
  const spName = Object.fromEntries(state.sp.map(s=>[s.id,s.zh]));
  const tyName = Object.fromEntries(TYPES.map(t=>[t.id,t.zh]));
  const pages = Math.max(1, Math.ceil(arts.length/PAGE));
  state.page = Math.min(state.page, pages);
  const slice = arts.slice((state.page-1)*PAGE, state.page*PAGE);
  const w = state.weekData;
  $("summary").textContent = w ? `${w.from} – ${w.to}　共 ${w.articles.length} 篇，符合篩選 ${arts.length} 篇` : "";

  if(!w){ $("list").innerHTML = `<div class="empty">尚無資料。請到 GitHub Actions 手動執行一次「Weekly update」。</div>`; $("pager").innerHTML=""; return; }
  if(!arts.length){
    const why = !state.selSp.size ? "目前沒有勾選任何次專科。" : !state.selTy.size ? "目前沒有勾選任何文章類型。" : "沒有符合條件的文章。";
    $("list").innerHTML = `<div class="empty">${why}</div>`; $("pager").innerHTML=""; return;
  }
  $("list").innerHTML = slice.map(a => {
    const au = a.authors.length > 6 ? a.authors.slice(0,6).join(", ") + ", et al." : a.authors.join(", ");
    return `<article class="card t-${a.type}">
      <div class="meta">
        <span class="badge b-${a.type}">${tyName[a.type]}</span>
        <span>${esc(a.journal)}</span><span>·</span><span>${esc(a.pubdate)}</span>
        ${a.categories.map(c=>`<span class="tag">${ic(c)}${esc(spName[c]||c)}</span>`).join("")}
      </div>
      <h3><a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">${highlight(a.title, q)}</a></h3>
      <div class="authors">${highlight(au, q)}</div>
      ${a.abstract ? `<details><summary>摘要 Abstract</summary><p>${highlight(a.abstract, q)}</p></details>` : ""}
      <div class="links">
        <a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">PubMed ${a.pmid}</a>
        ${a.doi ? `<a href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener">DOI 全文</a>` : ""}
        ${a.pmc ? `<a href="https://pmc.ncbi.nlm.nih.gov/articles/${esc(a.pmc)}/" target="_blank" rel="noopener">PMC 免費全文</a>` : ""}
      </div>
    </article>`;
  }).join("");
  $("pager").innerHTML = pages > 1 ? `
    <button ${state.page<=1?"disabled":""} data-pg="${state.page-1}">上一頁</button>
    <span class="cnt" style="align-self:center">${state.page} / ${pages}</span>
    <button ${state.page>=pages?"disabled":""} data-pg="${state.page+1}">下一頁</button>` : "";
}

function render(){ renderChecks(); renderList(); renderMonitor(); }

async function loadWeek(week){
  if(!week){ state.weekData = null; render(); return; }
  $("list").innerHTML = `<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span><br>誘導中… 資料載入中</div>`;
  const r = await fetch(`data/weeks/${week}.json`, {cache:"no-cache"});
  state.weekData = await r.json();
  state.page = 1;
  render();
}

const WD = "日一二三四五六";
// 一律以台北時間顯示（不受觀看者所在時區影響）
function tpeParts(d){
  const t = new Date(d.getTime() + 8*3600e3);
  return {y:t.getUTCFullYear(), m:t.getUTCMonth()+1, d:t.getUTCDate(), w:t.getUTCDay(), h:t.getUTCHours(), mi:t.getUTCMinutes()};
}
const p2 = n => String(n).padStart(2,"0");
function fmtTime(iso){
  const p = tpeParts(new Date(iso));
  return `${p.y}/${p2(p.m)}/${p2(p.d)}（${WD[p.w]}）${p2(p.h)}:${p2(p.mi)}`;
}
function nextMonday(){
  // 排程：每週一 00:00 UTC = 台北 08:00
  const now = new Date();
  const n = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
  do { n.setUTCDate(n.getUTCDate()+1); } while(n.getUTCDay() !== 1);
  if(now.getUTCDay() === 1 && now.getUTCHours() < 1) n.setUTCDate(n.getUTCDate()-7);
  const p = tpeParts(n);
  return `${p.y}/${p2(p.m)}/${p2(p.d)}（一）08:00 左右`;
}

async function init(){
  let idx;
  try{
    idx = await (await fetch("data/index.json", {cache:"no-cache"})).json();
  }catch(e){
    idx = {subspecialties:[], weeks:[]};
  }
  state.sp = idx.subspecialties;
  if(!restore()) state.selSp = new Set(state.sp.map(s=>s.id));
  $("updated").innerHTML = idx.updated
    ? `<span>🕒 上次更新：${fmtTime(idx.updated)}</span><span class="next">下次更新：${nextMonday()}</span>`
    : `<span class="next">尚未更新</span>`;
  $("week").innerHTML = idx.weeks.map((w,i) =>
    `<option value="${w.week}">${w.from} – ${w.to}（${w.total} 篇）${i===0?"・最新":""}</option>`).join("");
  await loadWeek(idx.weeks[0]?.week);
}

$("week").onchange = e => loadWeek(e.target.value);
$("spAll").onclick  = () => { state.selSp = new Set(state.sp.map(s=>s.id)); state.page=1; store(); render(); };
$("spNone").onclick = () => { state.selSp.clear(); state.page=1; store(); render(); };
$("tyAll").onclick  = () => { state.selTy = new Set(TYPES.map(t=>t.id)); state.page=1; store(); render(); };
$("tyNone").onclick = () => { state.selTy.clear(); state.page=1; store(); render(); };
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.sp){ t.checked ? state.selSp.add(t.dataset.sp) : state.selSp.delete(t.dataset.sp); }
  else if(t.dataset.ty){ t.checked ? state.selTy.add(t.dataset.ty) : state.selTy.delete(t.dataset.ty); }
  else return;
  state.page = 1; store(); render();
});
let timer; $("q").oninput = () => { clearTimeout(timer); timer = setTimeout(()=>{state.page=1; renderList();}, 200); };
$("sort").onchange = () => renderList();
$("pager").onclick = e => { const p = e.target.dataset.pg; if(p){ state.page = +p; renderList(); window.scrollTo({top:0,behavior:"smooth"}); } };
init();
</script>
</body>
</html>
