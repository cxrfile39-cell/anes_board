<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻醉次專科文獻週報 | Anesthesiology Weekly Digest</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#5d6b7e; --line:#e2e6ec;
    --accent:#0f6e8c; --accent-soft:#e3f1f5;
    --art:#2f6fd0; --rev:#8a4fc4; --gl:#c2531c;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#12161c;--card:#1b2129;--ink:#e6ebf1;--muted:#9aa7b7;--line:#2c3540;
      --accent:#4fb3d1;--accent-soft:#1d3640;--art:#6ea0f0;--rev:#b98ae6;--gl:#ee8d5b;}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:20px 16px 14px}
  .wrap{max-width:1180px;margin:0 auto}
  h1{margin:0;font-size:1.45rem}
  .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
  main.wrap{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px 16px 60px}
  @media (max-width:860px){main.wrap{grid-template-columns:1fr}}
  aside{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:14px}
  @media (max-width:860px){aside{position:static}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .panel h2{font-size:.95rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  .btns{display:flex;gap:6px}
  button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:7px;padding:4px 10px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  label.opt{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:.9rem}
  label.opt:hover{background:var(--accent-soft)}
  label.opt input{accent-color:var(--accent);width:16px;height:16px;flex:none}
  label.opt .name{flex:1}
  label.opt .en{display:block;color:var(--muted);font-size:.74rem;line-height:1.2}
  .cnt{font-size:.75rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:1px 8px;font-variant-numeric:tabular-nums}
  select,input[type=search]{width:100%;font:inherit;font-size:.9rem;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;background:var(--bg);color:var(--ink)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .toolbar input[type=search]{flex:1;min-width:200px}
  .toolbar select{width:auto}
  .summary{color:var(--muted);font-size:.88rem;margin-bottom:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);margin-bottom:6px}
  .badge{font-weight:600;border-radius:5px;padding:1px 7px;font-size:.74rem;color:#fff}
  .b-article{background:var(--art)} .b-review{background:var(--rev)} .b-guideline{background:var(--gl)}
  .tag{border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:.72rem}
  .card h3{font-size:1rem;margin:0 0 4px;line-height:1.4}
  .card h3 a{color:var(--ink);text-decoration:none} .card h3 a:hover{color:var(--accent);text-decoration:underline}
  .authors{font-size:.84rem;color:var(--muted)}
  .links{margin-top:8px;display:flex;gap:12px;font-size:.84rem;flex-wrap:wrap}
  .links a{color:var(--accent);text-decoration:none} .links a:hover{text-decoration:underline}
  details summary{cursor:pointer;color:var(--accent);font-size:.84rem;margin-top:6px}
  details p{font-size:.88rem;white-space:pre-line;margin:6px 0 0}
  .empty{text-align:center;color:var(--muted);padding:50px 10px}
  .pager{display:flex;justify-content:center;gap:8px;margin-top:10px}
  mark{background:#ffe58a;color:inherit;border-radius:2px}
  footer{color:var(--muted);font-size:.78rem;text-align:center;padding:0 16px 30px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>麻醉次專科文獻週報</h1>
    <div class="sub">Anesthesiology Subspecialties · 最新期刊論文 / 綜述 / 指引 · 每週一自動更新（資料來源：PubMed）</div>
    <div class="sub" id="updated"></div>
  </div>
</header>

<main class="wrap">
  <aside>
    <div class="panel">
      <h2>週次</h2>
      <select id="week"></select>
    </div>

    <div class="panel">
      <h2>次專科
        <span class="btns">
          <button type="button" id="spAll">全選</button>
          <button type="button" id="spNone">全不選</button>
        </span>
      </h2>
      <div id="spList"></div>
    </div>

    <div class="panel">
      <h2>文章類型
        <span class="btns">
          <button type="button" id="tyAll">全選</button>
          <button type="button" id="tyNone">全不選</button>
        </span>
      </h2>
      <div id="tyList"></div>
    </div>
  </aside>

  <section>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜尋標題、摘要、作者、期刊…">
      <select id="sort">
        <option value="entrez">依 PubMed 收錄日</option>
        <option value="pub">依出版日期</option>
        <option value="journal">依期刊名稱</option>
      </select>
    </div>
    <div class="summary" id="summary"></div>
    <div id="list"></div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<footer>資料由 NCBI PubMed E-utilities 自動擷取，分類依關鍵字與期刊檢索式，僅供參考。</footer>

<script>
const TYPES = [
  {id:"article",  zh:"原始研究", en:"Journal Article"},
  {id:"review",   zh:"綜述 / 統合分析", en:"Review · SR · MA"},
  {id:"guideline",zh:"指引 / 共識", en:"Guideline · Consensus"},
];
const PAGE = 50;
const state = {sp:[], weekData:null, page:1, selSp:new Set(), selTy:new Set(TYPES.map(t=>t.id))};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function store(){
  try{ localStorage.setItem("anesth-filter", JSON.stringify({sp:[...state.selSp], ty:[...state.selTy]})); }catch(e){}
}
function restore(){
  try{
    const s = JSON.parse(localStorage.getItem("anesth-filter") || "null");
    if(s){ state.selSp = new Set(s.sp); state.selTy = new Set(s.ty); return true; }
  }catch(e){}
  return false;
}

function renderChecks(){
  const arts = state.weekData?.articles || [];
  const spCount = {}, tyCount = {};
  for(const a of arts){
    for(const c of a.categories) spCount[c] = (spCount[c]||0)+1;
    tyCount[a.type] = (tyCount[a.type]||0)+1;
  }
  $("spList").innerHTML = state.sp.map(s => `
    <label class="opt"><input type="checkbox" data-sp="${s.id}" ${state.selSp.has(s.id)?"checked":""}>
      <span class="name">${esc(s.zh)}<span class="en">${esc(s.en)}</span></span>
      <span class="cnt">${spCount[s.id]||0}</span></label>`).join("");
  $("tyList").innerHTML = TYPES.map(t => `
    <label class="opt"><input type="checkbox" data-ty="${t.id}" ${state.selTy.has(t.id)?"checked":""}>
      <span class="name">${t.zh}<span class="en">${t.en}</span></span>
      <span class="cnt">${tyCount[t.id]||0}</span></label>`).join("");
}

function highlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
  return safe.replace(re, "<mark>$1</mark>");
}

function filtered(){
  const q = $("q").value.trim().toLowerCase();
  let arts = (state.weekData?.articles || []).filter(a =>
    state.selTy.has(a.type) && a.categories.some(c => state.selSp.has(c)) &&
    (!q || (a.title+" "+a.abstract+" "+a.authors.join(" ")+" "+a.journal).toLowerCase().includes(q)));
  const s = $("sort").value;
  const cmp = {
    entrez:(a,b)=> (b.entrez||"").localeCompare(a.entrez||"") || (b.sortdate||"").localeCompare(a.sortdate||""),
    pub:(a,b)=> (b.sortdate||"").localeCompare(a.sortdate||""),
    journal:(a,b)=> a.journal.localeCompare(b.journal),
  }[s];
  return arts.slice().sort(cmp);
}

function renderList(){
  const arts = filtered();
  const q = $("q").value.trim();
  const spName = Object.fromEntries(state.sp.map(s=>[s.id,s.zh]));
  const tyName = Object.fromEntries(TYPES.map(t=>[t.id,t.zh]));
  const pages = Math.max(1, Math.ceil(arts.length/PAGE));
  state.page = Math.min(state.page, pages);
  const slice = arts.slice((state.page-1)*PAGE, state.page*PAGE);
  const w = state.weekData;
  $("summary").textContent = w ? `${w.from} – ${w.to}　共 ${w.articles.length} 篇，符合篩選 ${arts.length} 篇` : "";

  if(!w){ $("list").innerHTML = `<div class="empty">尚無資料。請到 GitHub Actions 手動執行一次「Weekly update」。</div>`; $("pager").innerHTML=""; return; }
  if(!arts.length){
    const why = !state.selSp.size ? "目前沒有勾選任何次專科。" : !state.selTy.size ? "目前沒有勾選任何文章類型。" : "沒有符合條件的文章。";
    $("list").innerHTML = `<div class="empty">${why}</div>`; $("pager").innerHTML=""; return;
  }
  $("list").innerHTML = slice.map(a => {
    const au = a.authors.length > 6 ? a.authors.slice(0,6).join(", ") + ", et al." : a.authors.join(", ");
    return `<article class="card">
      <div class="meta">
        <span class="badge b-${a.type}">${tyName[a.type]}</span>
        <span>${esc(a.journal)}</span><span>·</span><span>${esc(a.pubdate)}</span>
        ${a.categories.map(c=>`<span class="tag">${esc(spName[c]||c)}</span>`).join("")}
      </div>
      <h3><a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">${highlight(a.title, q)}</a></h3>
      <div class="authors">${highlight(au, q)}</div>
      ${a.abstract ? `<details><summary>摘要 Abstract</summary><p>${highlight(a.abstract, q)}</p></details>` : ""}
      <div class="links">
        <a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">PubMed ${a.pmid}</a>
        ${a.doi ? `<a href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener">DOI 全文</a>` : ""}
        ${a.pmc ? `<a href="https://pmc.ncbi.nlm.nih.gov/articles/${esc(a.pmc)}/" target="_blank" rel="noopener">PMC 免費全文</a>` : ""}
      </div>
    </article>`;
  }).join("");
  $("pager").innerHTML = pages > 1 ? `
    <button ${state.page<=1?"disabled":""} data-pg="${state.page-1}">上一頁</button>
    <span class="cnt" style="align-self:center">${state.page} / ${pages}</span>
    <button ${state.page>=pages?"disabled":""} data-pg="${state.page+1}">下一頁</button>` : "";
}

function render(){ renderChecks(); renderList(); }

async function loadWeek(week){
  if(!week){ state.weekData = null; render(); return; }
  const r = await fetch(`data/weeks/${week}.json`, {cache:"no-cache"});
  state.weekData = await r.json();
  state.page = 1;
  render();
}

async function init(){
  let idx;
  try{
    idx = await (await fetch("data/index.json", {cache:"no-cache"})).json();
  }catch(e){
    idx = {subspecialties:[], weeks:[]};
  }
  state.sp = idx.subspecialties;
  if(!restore()) state.selSp = new Set(state.sp.map(s=>s.id));
  $("updated").textContent = idx.updated ? `最後更新：${idx.updated.replace("T"," ").slice(0,16)}（台北時間）` : "";
  $("week").innerHTML = idx.weeks.map((w,i) =>
    `<option value="${w.week}">${w.from} – ${w.to}（${w.total} 篇）${i===0?"・最新":""}</option>`).join("");
  await loadWeek(idx.weeks[0]?.week);
}

$("week").onchange = e => loadWeek(e.target.value);
$("spAll").onclick  = () => { state.selSp = new Set(state.sp.map(s=>s.id)); state.page=1; store(); render(); };
$("spNone").onclick = () => { state.selSp.clear(); state.page=1; store(); render(); };
$("tyAll").onclick  = () => { state.selTy = new Set(TYPES.map(t=>t.id)); state.page=1; store(); render(); };
$("tyNone").onclick = () => { state.selTy.clear(); state.page=1; store(); render(); };
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.sp){ t.checked ? state.selSp.add(t.dataset.sp) : state.selSp.delete(t.dataset.sp); }
  else if(t.dataset.ty){ t.checked ? state.selTy.add(t.dataset.ty) : state.selTy.delete(t.dataset.ty); }
  else return;
  state.page = 1; store(); render();
});
let timer; $("q").oninput = () => { clearTimeout(timer); timer = setTimeout(()=>{state.page=1; renderList();}, 200); };
$("sort").onchange = () => renderList();
$("pager").onclick = e => { const p = e.target.dataset.pg; if(p){ state.page = +p; renderList(); window.scrollTo({top:0,behavior:"smooth"}); } };
init();
</script>
</body>
</html>
