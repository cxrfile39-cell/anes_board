name: Weekly update

on:
  schedule:
    - cron: "0 0 * * 1"   # Monday 08:00 Taipei time
  workflow_dispatch:
    inputs:
      days:
        description: "Days to fetch"
        required: false
        default: "7"
  push:
    branches: [main]
    paths: ["index.html", "fetch_pubmed.py", "subspecialties.json", "journal_if.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch PubMed
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          if [ ! -f data/index.json ]; then
            DAYS=28 python fetch_pubmed.py
          elif [ "${{ github.event_name }}" != "push" ]; then
            DAYS=${INPUT_DAYS:-7} python fetch_pubmed.py
          else
            python fetch_pubmed.py --enrich-only
          fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Weekly update $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
